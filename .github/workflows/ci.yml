name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build All Lessons
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Cache Botan build
        id: cache-botan
        uses: actions/cache@v4
        with:
          path: |
            include/
            lib/
            bin/
          key: botan-${{ runner.os }}-${{ hashFiles('.gitmodules') }}-${{ github.sha }}
          restore-keys: |
            botan-${{ runner.os }}-${{ hashFiles('.gitmodules') }}-

      - name: Build Botan from source
        if: steps.cache-botan.outputs.cache-hit != 'true'
        run: make setup

      - name: Build all lessons
        run: make all

      - name: Run lessons (smoke test)
        run: |
          for bin in [0-9][0-9]*.cpp; do
            ./"${bin%.cpp}"
          done
